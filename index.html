
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenior Voice | Samuel Tech IA</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080d12;
  --panel: #111a23;
  --green: #4dffb5;
  --blue: #56baff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px 14px;
  background: radial-gradient(ellipse at top, #12372e, var(--bg) 65%);
  color: #f1f7fb;
  font-family: Arial, sans-serif;
}
main { max-width: 760px; margin: auto; }
header { text-align: center; padding: 16px 0 24px; }
.logo { font-size: 42px; color: var(--green); }
h1 { color: var(--green); letter-spacing: 3px; }
p { color: #a8bac8; line-height: 1.5; }
.panel {
  background: var(--panel);
  border: 1px solid #27443f;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
}
label { display: block; margin-bottom: 8px; font-weight: bold; }
select, textarea, button {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  font: inherit;
  margin-top: 8px;
}
select, textarea {
  color: white;
  background: #091117;
  border: 1px solid #30434e;
}
textarea { min-height: 90px; resize: vertical; }
button {
  cursor: pointer;
  background: #0c795b;
  border: 1px solid #31d99e;
  color: white;
  font-weight: bold;
}
button.secondary { background: #152c40; border-color: #397bb4; }
button.stop { background: #46232b; border-color: #a54b5d; }
button:disabled { opacity: .5; cursor: not-allowed; }
#status { color: var(--green); overflow-wrap: anywhere; }
#conversation {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
  max-height: 350px;
  overflow-y: auto;
}
.small { font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">◉</div>
    <h1>LENIOR VOICE</h1>
    <p>Samuel Tech IA · Assistente de voz</p>
  </header>

  <section class="panel">
    <label for="mode">Modo de voz</label>
    <select id="mode">
      <option value="basic">1 — Voz do navegador</option>
      <option value="tts">2 — Voz gerada pela API Gemini</option>
      <option value="live">3 — Conversa em tempo real</option>
    </select>
    <p id="modeInfo" class="small">
      O navegador reconhece sua fala e lê a resposta do Lenior.
    </p>
    <button id="start">🎙️ Iniciar conversa</button>
    <button id="stop" class="stop">⏹️ Parar</button>
    <p id="status" role="status">Pronto para iniciar.</p>
  </section>

  <section class="panel">
    <label for="message">Ou digite uma mensagem</label>
    <textarea id="message" placeholder="Digite sua pergunta..."></textarea>
    <button id="send" class="secondary">Enviar mensagem</button>
  </section>

  <section class="panel">
    <h3>Conversa</h3>
    <div id="conversation">Lenior: Olá! Escolha um modo para começar.</div>
  </section>

  <p class="small">
    Use HTTPS e permita o microfone quando o navegador solicitar.
    O modo Live pode consumir cota da API.
  </p>
</main>

<script>
const API = "https://programador-api-100.onrender.com";
const $ = id => document.getElementById(id);
const Recognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let active = false;
let busy = false;
let recognition = null;
let liveSocket = null;
let liveStream = null;
let liveContext = null;
let liveSource = null;
let liveProcessor = null;
let liveMute = null;
let liveReady = false;
let liveNextTime = 0;
let liveGeneration = 0;

function setStatus(message) {
  $("status").textContent = message;
}

function logMessage(who, text) {
  $("conversation").textContent += "\n\n" + who + ": " + text;
  $("conversation").scrollTop = $("conversation").scrollHeight;
}

// Lê a resposta como texto primeiro, para não quebrar
// quando o Render devolver HTML em vez de JSON.
async function readJson(response) {
  const raw = await response.text();

  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    console.error("Resposta não JSON:", raw.slice(0, 500));
    throw new Error(
      `O servidor retornou HTML/texto (HTTP ${response.status}). ` +
      "Confira o deploy e a rota no Render."
    );
  }

  if (!response.ok) {
    throw new Error(data.erro || `Erro HTTP ${response.status}`);
  }

  return data;
}

async function askChat(text) {
  const response = await fetch(API + "/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mensagem: text, historico: [] })
  });

  const data = await readJson(response);
  if (!data.resposta) throw new Error("O chat não retornou resposta.");
  return data.resposta;
}

// MODO 1: voz do navegador
function speakInBrowser(text) {
  return new Promise((resolve, reject) => {
    if (!window.speechSynthesis) {
      reject(new Error("Síntese de voz indisponível."));
      return;
    }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "pt-BR";
    utterance.rate = 1;

    utterance.onstart = () => setStatus("🔊 Lenior está falando...");
    utterance.onend = resolve;
    utterance.onerror = () => reject(new Error("Falha ao reproduzir voz."));
    window.speechSynthesis.speak(utterance);
  });
}

// MODO 2: API de síntese de fala
async function speakWithAPI(text) {
  setStatus("Gerando áudio com Gemini...");

  const response = await fetch(API + "/api/voice/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ texto: text })
  });

  const data = await readJson(response);
  if (!data.audio) throw new Error("A API não retornou áudio.");

  const audio = new Audio(
    `data:${data.formato || "audio/wav"};base64,${data.audio}`
  );

  setStatus("🔊 Reproduzindo resposta...");
  await audio.play();

  await new Promise((resolve, reject) => {
    audio.onended = resolve;
    audio.onerror = () => reject(new Error("Falha na reprodução."));
  });
}

async function answerWithChat(text) {
  const answer = await askChat(text);
  logMessage("Lenior", answer);

  if ($("mode").value === "tts") {
    await speakWithAPI(answer);
  } else {
    await speakInBrowser(answer);
  }
}

// Modos 1 e 2: reconhecimento de voz pelo navegador
function startRecognition() {
  if (!active || busy || $("mode").value === "live") return;

  if (!Recognition) {
    active = false;
    setStatus("Reconhecimento não disponível neste navegador.");
    return;
  }

  try {
    recognition = new Recognition();
    recognition.lang = "pt-BR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => setStatus("🎙️ Estou ouvindo...");
    recognition.onresult = async event => {
      const text = event.results[0][0].transcript.trim();
      if (!text || !active || busy) return;

      logMessage("Você", text);
      busy = true;
      setStatus("Lenior está pensando...");

      try {
        await answerWithChat(text);
      } catch (error) {
        setStatus(error.message);
      } finally {
        busy = false;
        if (active && $("mode").value !== "live") {
          setTimeout(startRecognition, 500);
        }
      }
    };

    recognition.onerror = event => {
      if (event.error === "not-allowed") {
        active = false;
        setStatus("Permita o acesso ao microfone.");
      } else if (event.error !== "no-speech" &&
                 event.error !== "aborted") {
        setStatus("Erro de reconhecimento: " + event.error);
      }
    };

    recognition.onend = () => {
      if (active && !busy && $("mode").value !== "live") {
        setTimeout(startRecognition, 500);
      }
    };

    recognition.start();
  } catch {
    setStatus("Não foi possível iniciar o microfone. Tente novamente.");
  }
}

// MODO 3: Gemini Live via WebSocket e token temporário
function floatTo16BitPCM(float32) {
  const output = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const sample = Math.max(-1, Math.min(1, float32[i]));
    output[i] = sample < 0 ? sample * 32768 : sample * 32767;
  }
  return output;
}

function resampleTo16k(input, inputRate) {
  if (inputRate === 16000) return floatTo16BitPCM(input);

  const ratio = inputRate / 16000;
  const length = Math.floor(input.length / ratio);
  const output = new Float32Array(length);

  for (let i = 0; i < length; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(Math.floor((i + 1) * ratio), input.length);
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    output[i] = sum / Math.max(1, end - start);
  }

  return floatTo16BitPCM(output);
}

function bufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}

function playLiveAudio(base64) {
  if (!liveContext) return;

  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const usableBytes = bytes.length - (bytes.length % 2);
  const pcm = new Int16Array(
    bytes.buffer, bytes.byteOffset, usableBytes / 2
  );
  const samples = new Float32Array(pcm.length);

  for (let i = 0; i < pcm.length; i++) samples[i] = pcm[i] / 32768;

  const audioBuffer = liveContext.createBuffer(1, samples.length, 24000);
  audioBuffer.copyToChannel(samples, 0);

  const source = liveContext.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(liveContext.destination);

  const startAt = Math.max(liveContext.currentTime + 0.03, liveNextTime);
  source.start(startAt);
  liveNextTime = startAt + audioBuffer.duration;
}

async function startLive() {
  active = true;
  const generation = ++liveGeneration;

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("O microfone exige HTTPS e suporte do navegador.");
    }

    setStatus("Solicitando token temporário...");

    const tokenResponse = await fetch(API + "/api/voice/live-token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });

    const tokenData = await readJson(tokenResponse);
    if (!tokenData.token) throw new Error("O servidor não retornou token.");

    if (!active || generation !== liveGeneration) return;

    liveStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    liveContext = new AudioContext();
    await liveContext.resume();

    const url =
      "wss://generativelanguage.googleapis.com/ws/" +
      "google.ai.generativelanguage.v1beta." +
      "GenerativeService.BidiGenerateContentConstrained" +
      "?access_token=" + encodeURIComponent(tokenData.token);

    liveSocket = new WebSocket(url);

    liveSocket.onopen = () => {
      liveSocket.send(JSON.stringify({
        setup: {
          model: "models/" + "gemini-3.8-live",
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: "Kore" }
              }
            }
          },
          systemInstruction: {
            parts: [{
              text:
                "Você é Lenior, assistente da Samuel Tech IA. " +
                "Fale em português brasileiro, de maneira natural, " +
                "clara e útil."
            }]
          },
          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      }));

      setStatus("Conectando ao Gemini Live...");
    };

    liveSocket.onmessage = event => {
      let message;
      try {
        message = JSON.parse(event.data);
      } catch {
        console.error("Mensagem Live não JSON:", event.data);
        return;
      }

      if (message.error) {
        setStatus("Erro Gemini Live: " +
          (message.error.message || "erro desconhecido"));
        return;
      }

      if (message.setupComplete) {
        liveReady = true;

        liveSource = liveContext.createMediaStreamSource(liveStream);
        liveProcessor = liveContext.createScriptProcessor(4096, 1, 1);
        liveMute = liveContext.createGain();
        liveMute.gain.value = 0;

        liveProcessor.onaudioprocess = event => {
          if (!active || !liveReady ||
              liveSocket?.readyState !== WebSocket.OPEN) return;

          const input = event.inputBuffer.getChannelData(0);
          const pcm = resampleTo16k(input, liveContext.sampleRate);

          liveSocket.send(JSON.stringify({
            realtimeInput: {
              audio: {
                data: bufferToBase64(pcm.buffer),
                mimeType: "audio/pcm;rate=16000"
              }
            }
          }));
        };

        liveSource.connect(liveProcessor);
        liveProcessor.connect(liveMute);
        liveMute.connect(liveContext.destination);

        setStatus("🎙️ Gemini Live conectado. Pode falar.");
        return;
      }

      const content = message.serverContent;
      if (!content) return;

      const inputText = content.inputTranscription?.text;
      if (inputText) logMessage("Você", inputText);

      const outputText = content.outputTranscription?.text;
      if (outputText) logMessage("Lenior", outputText);

      for (const part of content.modelTurn?.parts || []) {
        if (part.inlineData?.data) playLiveAudio(part.inlineData.data);
        if (part.text) logMessage("Lenior", part.text);
      }

      if (content.turnComplete) {
        setStatus("Gemini Live pronto para continuar.");
      }
    };

    liveSocket.onerror = () => {
      setStatus("Falha WebSocket. Verifique modelo, token e acesso à API.");
    };

    liveSocket.onclose = event => {
      liveReady = false;
      if (active) {
        setStatus("Conexão Live encerrada (código " + event.code + ").");
      }
    };
  } catch (error) {
    stopVoice();
    setStatus("Erro no modo Live: " + error.message);
  }
}

function stopVoice() {
  active = false;
  liveGeneration++;
  liveReady = false;

  if (recognition) {
    try { recognition.abort(); } catch {}
    recognition = null;
  }

  if (liveSocket) {
    try { liveSocket.close(); } catch {}
    liveSocket = null;
  }

  if (liveProcessor) liveProcessor.disconnect();
  if (liveSource) liveSource.disconnect();
  if (liveMute) liveMute.disconnect();

  liveProcessor = null;
  liveSource = null;
  liveMute = null;

  if (liveStream) {
    liveStream.getTracks().forEach(track => track.stop());
    liveStream = null;
  }

  if (liveContext) {
    liveContext.close().catch(() => {});
    liveContext = null;
  }

  window.speechSynthesis?.cancel();
  setStatus("Voz parada.");
}

$("start").addEventListener("click", async () => {
  stopVoice();

  if ($("mode").value === "live") {
    await startLive();
  } else {
    active = true;
    startRecognition();
  }
});

$("stop").addEventListener("click", stopVoice);

$("send").addEventListener("click", async () => {
  const text = $("message").value.trim();
  if (!text || busy) return;

  busy = true;
  $("send").disabled = true;
  $("message").value = "";
  logMessage("Você", text);
  setStatus("Lenior está pensando...");

  try {
    await answerWithChat(text);
    setStatus("Resposta concluída.");
  } catch (error) {
    setStatus(error.message);
  } finally {
    busy = false;
    $("send").disabled = false;
  }
});

$("message").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("send").click();
  }
});

$("mode").addEventListener("change", () => {
  const info = {
    basic: "Voz do navegador: reconhecimento e resposta falada.",
    tts: "Reconhecimento do navegador e voz gerada pelo Gemini.",
    live: "Conversa de áudio em tempo real via Gemini Live."
  };

  $("modeInfo").textContent = info[$("mode").value];
  stopVoice();
});

window.addEventListener("beforeunload", stopVoice);
</script>
</body>
</html>
